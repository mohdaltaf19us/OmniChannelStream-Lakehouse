---
# OmniOC Local Development — Kafka Stack
# ========================================
# Start: docker-compose up -d
# Stop:  docker-compose down
# UI:    http://localhost:8080  (Kafka UI)
# Schema Registry: http://localhost:8081
#
# After starting, create topics:
#   docker exec omnioc-kafka kafka-topics --create --topic clickstream-events \
#     --partitions 6 --replication-factor 1 --bootstrap-server localhost:9092
#   docker exec omnioc-kafka kafka-topics --create --topic device-telemetry \
#     --partitions 3 --replication-factor 1 --bootstrap-server localhost:9092
#   docker exec omnioc-kafka kafka-topics --create --topic order-events \
#     --partitions 3 --replication-factor 1 --bootstrap-server localhost:9092
#   docker exec omnioc-kafka kafka-topics --create --topic dq-alerts \
#     --partitions 1 --replication-factor 1 --bootstrap-server localhost:9092

version: "3.8"

services:

  # ─── Zookeeper ─────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: omnioc-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - omnioc-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo 'ruok' | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Broker ──────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: omnioc-kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"    # External (host) access
      - "29092:29092"  # Internal (container-to-container) access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      # Two listeners: one for host access, one for inter-container
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 104857600  # 100MB
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # JVM heap for development
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms256M"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - omnioc-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─── Schema Registry ───────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: omnioc-schema-registry
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka:29092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_DEBUG: "false"
    networks:
      - omnioc-net

  # ─── Kafka UI ──────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: omnioc-kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "OmniOC-Dev"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      KAFKA_CLUSTERS_0_METRICS_PORT: 9101
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - omnioc-net

  # ─── Topic Initializer (runs once then exits) ───────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: omnioc-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      kafka-topics --bootstrap-server kafka:29092 --list

      echo 'Creating topics...'

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic clickstream-events --partitions 6 --replication-factor 1 \
        --config retention.ms=86400000 --config cleanup.policy=delete

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic device-telemetry --partitions 3 --replication-factor 1 \
        --config retention.ms=86400000 --config cleanup.policy=delete

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic order-events --partitions 3 --replication-factor 1 \
        --config retention.ms=604800000 --config cleanup.policy=delete

      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic dq-alerts --partitions 1 --replication-factor 1 \
        --config retention.ms=259200000

      echo 'Topics created:'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - omnioc-net

  # ─── SQL Server (simulates on-prem OLTP source) ─────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: omnioc-sqlserver
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "OmniOC@Dev2024!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_AGENT_ENABLED: "true"  # Required for CDC agent jobs
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - omnioc-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'OmniOC@Dev2024!' -Q 'SELECT 1' -No"]
      interval: 15s
      timeout: 10s
      retries: 10

# ─── Volumes ────────────────────────────────────────────────────
volumes:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  sqlserver_data:

# ─── Network ────────────────────────────────────────────────────
networks:
  omnioc-net:
    driver: bridge
    name: omnioc-network

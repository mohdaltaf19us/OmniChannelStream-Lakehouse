resources:
  warehouses:
    reporting_warehouse:
      name: omnioc-${var.env}-reporting
      cluster_size: "Small"
      min_num_clusters: 1
      max_num_clusters: 3
      auto_stop_mins: 30
      enable_serverless_compute: true
      warehouse_type: PRO
      spot_instance_policy: COST_OPTIMIZED
      channel:
        name: CHANNEL_NAME_CURRENT
      tags:
        custom_tags:
          - key: project
            value: omnioc-lakehouse
          - key: env
            value: ${var.env}

resources:
  pipelines:
    supply_chain_dlt:
      name: omnioc-${var.env}-supply-chain-dlt
      target: ${var.catalog}.silver
      catalog: ${var.catalog}

      configuration:
        catalog: ${var.catalog}
        storage_account: ${var.storage_account}
        env: ${var.env}
        spark.databricks.delta.schema.autoMerge.enabled: "true"

      libraries:
        - notebook:
            path: /Workspace/OmniOC/${bundle.target}/src/dlt_pipelines/supply_chain_dlt.sql

      clusters:
        - label: default
          node_type_id: ${var.node_type}
          autoscale:
            min_workers: 1
            max_workers: 4
          spark_conf:
            spark.databricks.io.cache.enabled: "true"
          custom_tags:
            project: omnioc-lakehouse
            env: ${var.env}

      continuous: false
      development: ${bundle.target == 'dev'}
      photon: false

      notifications:
        - email_recipients:
            - data-eng@omnioc.com
          alerts:
            - on-update-failure
            - on-update-fatal-failure
